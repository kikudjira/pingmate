name: Release

# Push a tag like v1.2.3 and this builds the DMG, publishes the release and
# points the Homebrew cask at it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (dry run — no release is published)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # macOS 26 is required, not a preference: the UI uses the Liquid Glass APIs
    # from the macOS 26 SDK, so an older Xcode cannot compile this at all.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build universal app
        run: ./scripts/build-app.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Package DMG
        id: dmg
        run: |
          ./scripts/make-dmg.sh "${{ steps.version.outputs.version }}"
          DMG="dist/PingMate-${{ steps.version.outputs.version }}.dmg"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingMate-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.path }}

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
            --title "PingMate ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Point the cask at the new release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tag build starts detached; move to the branch the cask lives on.
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          /usr/bin/sed -i '' \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/pingmate.rb

          if git diff --quiet Casks/pingmate.rb; then
            echo "Cask already current."
          else
            git commit -m "chore: cask -> $VERSION" Casks/pingmate.rb
            git push origin "HEAD:$BRANCH"
          fi
