name: Release

# Push a tag like v1.2.3 and this builds the DMG, publishes the release and
# points the Homebrew cask at it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (dry run — no release is published)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # macOS 26 is required, not a preference: the UI uses the Liquid Glass APIs
    # from the macOS 26 SDK, so an older Xcode cannot compile this at all.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build universal app
        run: ./scripts/build-app.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Package DMG
        id: dmg
        run: |
          ./scripts/make-dmg.sh "${{ steps.version.outputs.version }}"
          DMG="dist/PingMate-${{ steps.version.outputs.version }}.dmg"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PingMate-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.path }}

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.path }}" \
            --title "PingMate ${{ steps.version.outputs.version }}" \
            --generate-notes

      # The cask lives in kikudjira/homebrew-pingmate and is bumped by hand, so
      # the run leaves the two lines that change ready to copy.
      - name: Cask bump instructions
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Homebrew cask

          Update \`Casks/pingmate.rb\` in [homebrew-pingmate](https://github.com/kikudjira/homebrew-pingmate):

          \`\`\`ruby
            version "$VERSION"
            sha256 "$SHA256"
          \`\`\`
          SUMMARY
